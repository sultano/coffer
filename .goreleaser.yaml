version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: coffer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/sultano/coffer/cmd.version={{.Version}}
      - -X github.com/sultano/coffer/cmd.commit={{.ShortCommit}}
      - -X github.com/sultano/coffer/cmd.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

homebrew_casks:
  - repository:
      owner: sultano
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    binaries:
      - coffer
    homepage: "https://github.com/sultano/coffer"
    description: "CLI tool for managing application configuration with GCP Secret Manager integration"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/coffer"]
          end
